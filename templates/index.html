<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>claude-sync · {{ node }}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js"></script>
</head>
<body>
  <header>
    <h1>claude-sync <small>{{ node }}</small></h1>
    <div class="header-actions">
      {% if conflicts > 0 %}<a class="btn warn-btn" href="/conflicts">⚠ Конфликты: {{ conflicts }}</a>{% endif %}
      <button hx-get="/sessions{% if all %}?all=1{% endif %}" hx-target="#list" hx-swap="innerHTML">Обновить</button>
    </div>
  </header>
  <details class="new">
    <summary>Новая сессия</summary>
    <form hx-post="/new" hx-target="#new-msg" hx-swap="innerHTML" hx-disabled-elt="find button">
      <label>Папка
        <input name="path" list="dirs" required placeholder="~/projects/…" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false">
      </label>
      <label>ssh-ссылка, если репо на VPS ещё нет
        <input name="url" placeholder="git@github.com:user/repo.git" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false">
      </label>
      <label>Название (необязательно)
        <input name="name" autocomplete="off">
      </label>
      <div class="form-actions">
        <button class="primary">Запустить</button>
        <button type="reset" onclick="document.getElementById('new-msg').innerHTML = ''">Очистить</button>
      </div>
    </form>
    <div id="new-msg"></div>
    <datalist id="dirs">{% for d in dirs %}<option value="{{ d }}">{% endfor %}</datalist>
  </details>
  <main id="list">
    {% include "_list.html" %}
  </main>
</body>
</html>
